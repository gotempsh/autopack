name: Release

# Cutting a release is `git tag v0.2.0 && git push origin v0.2.0` from main.
# Everything below is the consequence of that one command: verify the tag is
# legitimate, build a binary per platform, publish them on a GitHub release.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag is cheap to create and impossible to un-publish once binaries are
  # attached to it, so every precondition is checked before anything is built.
  guard:
    name: Verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag must be on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at $GITHUB_SHA, which is not on main. Releases are cut from main only."
            exit 1
          fi

      # A tag that disagrees with Cargo.toml ships a binary that reports the
      # wrong version from `autopack --version` — worse than no release.
      - name: Tag must match the workspace version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "autopack-cli") | .version')"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${manifest}"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          case "$tag" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # CI already ran this on the commit when it landed on main; re-running it
      # here costs two minutes and closes the window where a tag is pushed at a
      # commit whose CI never finished.
      - name: Test
        run: cargo test --workspace

  build:
    name: ${{ matrix.target }}
    needs: guard
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl, not gnu: a statically linked binary runs on any Linux the
          # user happens to have, including the distroless and Alpine images
          # people run CI in.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-13
          - target: aarch64-apple-darwin
            runner: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build
        run: cargo build --release --locked -p autopack-cli --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        run: |
          name="autopack-${{ needs.guard.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/autopack" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "archive=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"

      # A release asset nobody can verify is a release asset nobody should
      # curl into a shell.
      - name: Checksum
        shell: bash
        run: |
          cd dist
          shasum -a 256 "$(basename '${{ steps.package.outputs.archive }}')" \
            > "$(basename '${{ steps.package.outputs.archive }}').sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: autopack-${{ matrix.target }}
          path: dist/*.tar.gz*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: [guard, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Collect checksums
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          rm -f *.sha256
          ls -l

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            ${{ needs.guard.outputs.prerelease == 'true' && '--prerelease' || '' }} \
            dist/*
